cases:
  hybrid_ETES_DA_ID_aFRR_energy_capacity_spain:
    name: hybrid_ETES_DA_ID_aFRR_energy_capacity_spain
    country: ES
    description: Fictitious Spanish pay-as-cleared aFRR-capacity demonstration
    timestep_minutes: 15
    simulation_start: 2025-01-01 00:00
    simulation_end: 2025-01-01 01:45
    timezone: Europe/Madrid
    additional_charges: false
    strategy:
      name: hybrid_etes_gas_pay_as_cleared_capacity
      dispatch:
        dispatch_method: pyomo
        rolling_horizon_enabled: true
        dispatch_horizon_hours: 2
        rolling_step_hours: 1
    solver:
      name: highs
      fallback_solvers:
        - gurobi
      tee: false
    market_sequence:
      - afrr_capacity
      - day_ahead
      - intraday_continuous
      - afrr_energy
    markets:
      afrr_capacity:
        enabled: true
        direction: down
        product_length: 15min
        price_unit: EUR_per_MW_per_product
        gate_open:
          day_relation: D-1
          time: "14:00"
        gate_close:
          day_relation: D-1
          time: "17:00"
        product_rules:
          min_bid_mw: 1.0
          bid_increment_mw: 1.0
          divisible: true
        signals:
          price: ES_aFRR_capacity_down_marginal_price
      day_ahead:
        enabled: true
        product_resolution: 15min
        gate_close:
          day_relation: D-1
          time: "12:00"
        signals:
          price: ES_day_ahead_price
      intraday_continuous:
        enabled: true
        product_resolution: 15min
        gate_close:
          relative_to_delivery_start_minutes: -5
        allowed_actions:
          buy: true
          sell: true
        signals:
          price: ES_intraday_price
          volume: ES_intraday_volume
      afrr_energy:
        enabled: true
        direction: down
        product_resolution: 15min
        gate_close:
          relative_to_delivery_start_minutes: -25
        product_rules:
          min_bid_mw: 1.0
          bid_increment_mw: 1.0
          validity_period_minutes: 15
        signals:
          price: ES_aFRR_energy_down_price
          system_activation: ES_aFRR_energy_down_quantity
        interpretation:
          activation_unit: MW
