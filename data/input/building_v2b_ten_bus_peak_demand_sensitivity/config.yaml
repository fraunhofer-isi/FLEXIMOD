    additional_charges: false
    solver: *id001
    market_sequence: *id002
    markets: *id003
    name: building_v2g_ten_bus_peak_demand_technical_annual
    description: Illustrative ten-bus annual maximum power-system peak-demand technical
      potential with ten 150 kW bidirectional chargers and a 1.5 MW bidirectional
      connection. It retains route and SOC constraints but uses a single maximum-service
      solve per horizon; it is not an approved capacity or an economic dispatch case.
    strategy:
      name: building_v2g
      dispatch:
        dispatch_method: pyomo
        rolling_horizon_enabled: true
        dispatch_horizon_hours: 48
        rolling_step_hours: 24
        currency: THB
